<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050B14" />
      <stop offset="45%" stop-color="#081426" />
      <stop offset="100%" stop-color="#040912" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="glowCyan" cx="20%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowBlue" cx="80%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>

    <!-- Blueprint Grid Pattern -->
    <pattern id="blueprintGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00f2fe" stroke-width="0.75" stroke-opacity="0.08" />
      <circle cx="0" cy="0" r="1.5" fill="#38bdf8" fill-opacity="0.2" />
    </pattern>

    <!-- Accent Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />
  <rect width="1200" height="360" fill="url(#blueprintGrid)" />
  <rect width="1200" height="360" fill="url(#glowCyan)" />
  <rect width="1200" height="360" fill="url(#glowBlue)" />

  <!-- Outer Frame -->
  <rect x="2" y="2" width="1196" height="356" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Left Tech Visual: Blueprint Terminal Box -->
  <g transform="translate(60, 65)">
    <!-- Terminal Backing -->
    <rect x="0" y="0" width="220" height="230" rx="14" fill="#0C1524" fill-opacity="0.85" stroke="#1E293B" stroke-width="1.5" />
    
    <!-- Window Controls -->
    <circle cx="22" cy="22" r="5" fill="#EF4444" fill-opacity="0.8" />
    <circle cx="38" cy="22" r="5" fill="#F59E0B" fill-opacity="0.8" />
    <circle cx="54" cy="22" r="5" fill="#10B981" fill-opacity="0.8" />
    <line x1="0" y1="38" x2="220" y2="38" stroke="#1E293B" stroke-width="1" />

    <!-- Terminal Code / Icon -->
    <g transform="translate(20, 56)">
      <!-- Blueprint Compass / Gear Hex Icon -->
      <polygon points="90,15 140,45 140,105 90,135 40,105 40,45" fill="#00F2FE" fill-opacity="0.06" stroke="#00F2FE" stroke-width="1.5" stroke-dasharray="4,3" />
      
      <!-- Center Lightning / Arrow -->
      <path d="M 92,38 L 74,78 L 92,78 L 88,112 L 108,68 L 92,68 Z" fill="#00F2FE" fill-opacity="0.9" />
      
      <circle cx="90" cy="75" r="48" fill="none" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="2,4" />
    </g>

    <!-- Terminal Prompt Line at Bottom -->
    <text x="20" y="208" fill="#38BDF8" font-family="'Courier New', monospace" font-size="11" font-weight="bold">$</text>
    <text x="35" y="208" fill="#E2E8F0" font-family="'Courier New', monospace" font-size="11">bash installer.sh</text>
    <rect x="155" y="198" width="8" height="12" fill="#00F2FE">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Right / Main Content -->
  <g transform="translate(320, 75)">
    <!-- Category Pill -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="280" height="28" rx="14" fill="#00F2FE" fill-opacity="0.1" stroke="#00F2FE" stroke-opacity="0.4" stroke-width="1" />
      <circle cx="16" cy="14" r="4" fill="#10B981">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="30" y="18" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">PTERODACTYL ECOSYSTEM • AUTOMATION</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="74" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
      Blueprint Installer
    </text>

    <!-- Subtitle -->
    <text x="0" y="108" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" letter-spacing="0.2">
      Automated, unattended &amp; resilient one-line installer for Blueprint Framework on Pterodactyl
    </text>

    <!-- Feature Badges Row -->
    <g transform="translate(0, 142)">
      <!-- Badge 1: One-Line -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="135" height="32" rx="8" fill="#0F172A" fill-opacity="0.9" stroke="#1E293B" stroke-width="1" />
        <text x="14" y="20" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">⚡ 1-Line Install</text>
      </g>

      <!-- Badge 2: Node.js 22+ -->
      <g transform="translate(145, 0)">
        <rect x="0" y="0" width="135" height="32" rx="8" fill="#0F172A" fill-opacity="0.9" stroke="#1E293B" stroke-width="1" />
        <text x="14" y="20" fill="#22C55E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">📦 Node.js 22+ Auto</text>
      </g>

      <!-- Badge 3: Unattended -->
      <g transform="translate(290, 0)">
        <rect x="0" y="0" width="125" height="32" rx="8" fill="#0F172A" fill-opacity="0.9" stroke="#1E293B" stroke-width="1" />
        <text x="14" y="20" fill="#A78BFA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🛡️ Unattended</text>
      </g>

      <!-- Badge 4: Author -->
      <g transform="translate(425, 0)">
        <rect x="0" y="0" width="165" height="32" rx="8" fill="#0F172A" fill-opacity="0.9" stroke="#1E293B" stroke-width="1" />
        <text x="14" y="20" fill="#FBBF24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">👑 By MFSAVANA</text>
      </g>
    </g>
  </g>

  <!-- Bottom Accent Gradient Line -->
  <rect x="0" y="356" width="1200" height="4" fill="url(#titleGrad)" />
</svg>